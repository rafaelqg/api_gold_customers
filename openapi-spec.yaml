openapi: 3.0.3
info:
  title: API de Clientes e Pagamentos
  description: API para consulta de clientes e estatísticas de pagamentos.
  version: 1.0.0

servers:
  - url: http://localhost:80

paths:

  /get_gold_customers:
    get:
      summary: Busca clientes com total de pagamentos superiores a $ 130,00
      description: Retorna uma lista de clientes ordenados pelo valor total de pagamentos, contendo apenas
      operationId: get_gold_customers
      tags:
        - Clientes
      responses:
        '200':
          description: Lista de clientes ordenados pelo valor total de pagamentos, contendo apenas aqueles superiores a $ 130,00.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientePagamento'

  /payments_per_month_year:
    get:
      summary: Busca médias mensais de pagamentos por ano
      operationId: buscaMediasMensaisPorAno
      tags:
        - Pagamentos
      responses:
        '200':
          description: Lista de médias mensais de pagamentos por ano.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaMensal'

  /ratings_proportion:
    get:
      summary: Busca proporção de classificações de filmes
      operationId: buscaProporcaoClassificacoes
      tags:
        - Filmes
      responses:
        '200':
          description: Lista de proporções de classificações de filmes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProporcaoClassificacao'


  /clientes/{id}:
    get:
      summary: Busca cliente por ID
      operationId: buscaCliente
      tags:
        - Clientes
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do cliente.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Dados do cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '404':
          description: Cliente não encontrado.

components:
  schemas:

    Cliente:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        customer_name:
          type: string
          example: João da Silva
       

    ClientePagamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        customer_name:
          type: string
          example: João da Silva

    MediaMensal:
      type: object
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 8
        value:
          type: number
          format: double
          example: 2450.35
    
    ProporcaoClassificacao:
      type: object
      properties:
        rating:
          type: string
          example: "PG"
        value:
          type: integer
          example: 100
        proportion:
          type: number
          format: double
          example: 0.25
       